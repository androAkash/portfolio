<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded hexagon -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0a0a0f" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Glowing Monogram A & K stylized terminal code glyph -->
  <path d="M18 46 L32 16 L46 46 M22 36 L42 36" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="32" cy="16" r="3" fill="#38bdf8" />
</svg>
